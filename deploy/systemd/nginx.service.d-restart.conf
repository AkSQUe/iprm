# Installed as /etc/systemd/system/nginx.service.d/restart.conf
#
# Two hardenings against the 2026-07-29 outage:
#
# 1. Stock nginx.service has no Restart= at all, so a single failed start left
#    the site down until a human noticed (13 minutes that day).
# 2. A glibc security upgrade made needrestart issue ONE systemctl restart for
#    nginx and systemd-resolved together. With no ordering between them, nginx
#    started while DNS was down. After= makes systemd order that same
#    transaction correctly.
[Unit]
After=systemd-resolved.service
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
Restart=on-failure
RestartSec=10s
