# Спільне тіло сайту: проксі до gunicorn, статика, first-party проксі GA.
# Включається з кожного server-блоку, який реально обслуговує застосунок
# (основний домен і -- поки він недоступний -- резервний). Виділено в сніпет,
# щоб два домени не розходились по конфігу.
#
# Встановлюється в /etc/nginx/snippets/iprm-app.conf через deploy/apply.sh.
# Не можна класти в /etc/nginx/conf.d/ -- звідти nginx.conf підхоплює файли на
# рівні http, а тут директиви рівня server.

client_max_body_size 25m;

# --- Google Analytics first-party proxy (recover ad-blocked traffic) ---
# Upstream hosts live in variables so nginx resolves them per request instead
# of at startup. A literal hostname in proxy_pass makes nginx refuse to start
# ("host not found in upstream") whenever DNS is briefly down -- e.g. when
# unattended-upgrades restarts systemd-resolved. That took the whole site
# down on 2026-07-29. With variables a DNS blip degrades only /ngx-i/.
resolver 127.0.0.53 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
set $gtm_upstream www.googletagmanager.com;
set $ga_upstream www.google-analytics.com;

location = /ngx-i/loader.js {
    rewrite ^ /gtag/js break;
    proxy_pass https://$gtm_upstream;
    proxy_set_header Host www.googletagmanager.com;
    proxy_ssl_server_name on;
    proxy_ssl_name www.googletagmanager.com;
    proxy_set_header Accept-Encoding "";
    expires 15m;
}
location /ngx-i/g/ {
    rewrite ^/ngx-i/g/(.*)$ /g/$1 break;
    proxy_pass https://$ga_upstream;
    proxy_set_header Host www.google-analytics.com;
    proxy_ssl_server_name on;
    proxy_ssl_name www.google-analytics.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
}

location /ngx-i/ {
    rewrite ^/ngx-i/(.*)$ /$1 break;
    proxy_pass https://$gtm_upstream;
    proxy_set_header Host www.googletagmanager.com;
    proxy_ssl_server_name on;
    proxy_ssl_name www.googletagmanager.com;
    proxy_set_header Accept-Encoding "";
}
# --- PostHog first-party proxy (EU cloud) ---
# Той самий мотив, що і в GA вище: запити на власний домен блокувальники не
# ріжуть. Хости знову в змінних -- буквальний хост у proxy_pass резолвиться
# на старті й кладе весь nginx при збої DNS (інцидент 29.07.2026).
# resolver уже оголошений вище, повторювати не треба.
#
# Локацій ТРИ, бо PostHog розводить трафік по двох апстрімах: статика і
# ремоут-конфіг живуть на -assets, решта -- на основному хості. Без
# окремої /array/ SDK не отримає конфіг і мовчки лишиться без реплею.
#
# Host обов'язковий на кожній: без нього PostHog віддає 401.
set $ph_assets_upstream eu-assets.i.posthog.com;
set $ph_api_upstream eu.i.posthog.com;

# SDK і фіче-скрипти: /ngx-e/static/array.js, recorder.js
location /ngx-e/static/ {
    rewrite ^/ngx-e/static/(.*)$ /static/$1 break;
    proxy_pass https://$ph_assets_upstream;
    proxy_set_header Host eu-assets.i.posthog.com;
    proxy_ssl_server_name on;
    proxy_ssl_name eu-assets.i.posthog.com;
    proxy_set_header Accept-Encoding "";
    expires 1h;
}

# Ремоут-конфіг SDK: /ngx-e/array/<token>/config.js
#
# no-store навмисно: у PostHog відкритий баг, де закешований у браузері 301
# з ротованого IP апстріму назавжди відправляє config.js на чужий сайт.
# Конфіг маленький і тягнеться раз на сесію -- кеш тут не вартий ризику.
location /ngx-e/array/ {
    rewrite ^/ngx-e/array/(.*)$ /array/$1 break;
    proxy_pass https://$ph_assets_upstream;
    proxy_set_header Host eu-assets.i.posthog.com;
    proxy_ssl_server_name on;
    proxy_ssl_name eu-assets.i.posthog.com;
    proxy_set_header Accept-Encoding "";
    add_header Cache-Control "no-store" always;
}

# Прийом подій, фіче-флаги, записи сесій.
#
# client_max_body_size тут окремо: глобальні 25m вище розраховані на
# завантаження медіа, а батчі записів сесій доходять до 64m і мовчки
# обрізались би з 413.
#
# X-Forwarded-For -- на відміну від GA-проксі, PostHog по ньому визначає
# гео, тож геолокація відвідувачів лишається правильною.
location /ngx-e/ {
    rewrite ^/ngx-e/(.*)$ /$1 break;
    proxy_pass https://$ph_api_upstream;
    proxy_set_header Host eu.i.posthog.com;
    proxy_ssl_server_name on;
    proxy_ssl_name eu.i.posthog.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 64m;
    add_header Cache-Control "no-store" always;
}

location / {
    proxy_pass http://unix:/var/www/iprm/iprm.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}

location /media/ {
    alias /var/www/iprm/media/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location /static/ {
    alias /var/www/iprm/app/static/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
