# Єдиний домен сайту -- iprm.space.
#
# plasma-regen.com прибрано 10.08.2026: реєстрацію не продовжили (закінчилась
# 04.08.2026 10:40 UTC), домен пішов на паркувальні NS і відновлювати його не
# будуть. Разом з блоками треба прибрати і його сертифікат, інакше certbot
# щодня падатиме на продовженні:  certbot delete --cert-name plasma-regen.com

# HTTP -> HTTPS. Редирект на запитаний хост, а не на жорстко заданий домен:
# так блок лишається придатним, якщо доменів колись знову стане більше.
server {
    listen 80;
    server_name iprm.space www.iprm.space;
    return 301 https://$host$request_uri;
}

# multimed.education -- старий домен прототипу, повністю переїхав на цей сайт.
# Своєї структури URL він не мав, тож редирект веде на головну, а не на
# $request_uri: інакше будь-яке старе посилання приземлялось би в 404.
#
# ACME-локація винесена окремо, а редирект живе в `location /`, а не на рівні
# server. `return` рівня server виконується у фазі rewrite -- ДО вибору
# location, тож при server-level редиректі certbot не пройшов би http-01
# ні зараз, ні на автопродовженні.
server {
    listen 80;
    server_name multimed.education www.multimed.education;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://iprm.space/;
    }
}

# www.iprm.space -> iprm.space.
# Перший блок 443 у конфізі, тож він же обслуговує невідомі SNI -- і зводить їх
# на основний домен замість того, щоб віддавати випадковий сертифікат.
server {
    listen 443 ssl;
    server_name www.iprm.space;

    ssl_certificate /etc/letsencrypt/live/iprm.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iprm.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://iprm.space$request_uri;
}

# Основний домен.
server {
    listen 443 ssl;
    server_name iprm.space;

    ssl_certificate /etc/letsencrypt/live/iprm.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iprm.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/snippets/iprm-app.conf;
}

server {
    listen 443 ssl;
    server_name multimed.education www.multimed.education;

    ssl_certificate /etc/letsencrypt/live/multimed.education/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/multimed.education/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://iprm.space/;
}
