# HTTP -> HTTPS. Редирект на запитаний хост, а не на жорстко заданий домен:
# інакше падіння основного домену забирає з собою і резервний.
server {
    listen 80;
    server_name plasma-regen.com www.plasma-regen.com iprm.space www.iprm.space;
    return 301 https://$host$request_uri;
}

# www.plasma-regen.com -> plasma-regen.com (canonical without www)
server {
    listen 443 ssl;
    server_name www.plasma-regen.com;

    ssl_certificate /etc/letsencrypt/live/plasma-regen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plasma-regen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://plasma-regen.com$request_uri;
}

# www.iprm.space -> iprm.space
server {
    listen 443 ssl;
    server_name www.iprm.space;

    ssl_certificate /etc/letsencrypt/live/iprm.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iprm.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://iprm.space$request_uri;
}

# Primary domain: plasma-regen.com
server {
    listen 443 ssl;
    server_name plasma-regen.com;

    ssl_certificate /etc/letsencrypt/live/plasma-regen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plasma-regen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/snippets/iprm-app.conf;
}

# ТИМЧАСОВО (з 04.08.2026): резервний домен обслуговує сайт напряму.
# Причина: реєстрацію plasma-regen.com не продовжили вчасно (закінчилась
# 04.08.2026 10:40 UTC), Namecheap перевів домен на паркувальні NS -- основний
# домен віддає заглушку. Раніше цей блок був `return 301` на основний домен.
#
# ЯК ПОВЕРНУТИ, коли plasma-regen.com знову резолвиться на цей сервер:
#   1) замінити `include ...` нижче на `return 301 https://plasma-regen.com$request_uri;`
#   2) прибрати блок `add_header X-Robots-Tag`
#   3) sudo /var/www/iprm/deploy/apply.sh
server {
    listen 443 ssl;
    server_name iprm.space;

    ssl_certificate /etc/letsencrypt/live/iprm.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iprm.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Резервний домен не повинен потрапити в індекс як дубль основного:
    # canonical у шаблонах будується з request.base_url, тож на цьому хості він
    # вказував би сам на себе. noindex дешевший за розбір дублів потім.
    add_header X-Robots-Tag "noindex, nofollow" always;

    include /etc/nginx/snippets/iprm-app.conf;
}
