# HTTP -> HTTPS redirect for all domains
server {
    listen 80;
    server_name plasma-regen.com www.plasma-regen.com iprm.space www.iprm.space;
    return 301 https://plasma-regen.com$request_uri;
}

# Old domain (iprm.space) -> 301 to new primary (plasma-regen.com)
server {
    listen 443 ssl;
    server_name iprm.space www.iprm.space;

    ssl_certificate /etc/letsencrypt/live/iprm.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iprm.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://plasma-regen.com$request_uri;
}

# www.plasma-regen.com -> plasma-regen.com (canonical without www)
server {
    listen 443 ssl;
    server_name www.plasma-regen.com;

    ssl_certificate /etc/letsencrypt/live/plasma-regen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plasma-regen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://plasma-regen.com$request_uri;
}

# Primary domain: plasma-regen.com
server {
    listen 443 ssl;
    server_name plasma-regen.com;
    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/plasma-regen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plasma-regen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- Google Analytics first-party proxy (recover ad-blocked traffic) ---
    # Upstream hosts live in variables so nginx resolves them per request instead
    # of at startup. A literal hostname in proxy_pass makes nginx refuse to start
    # ("host not found in upstream") whenever DNS is briefly down -- e.g. when
    # unattended-upgrades restarts systemd-resolved. That took the whole site
    # down on 2026-07-29. With variables a DNS blip degrades only /ngx-i/.
    resolver 127.0.0.53 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;
    set $gtm_upstream www.googletagmanager.com;
    set $ga_upstream www.google-analytics.com;

    location = /ngx-i/loader.js {
        rewrite ^ /gtag/js break;
        proxy_pass https://$gtm_upstream;
        proxy_set_header Host www.googletagmanager.com;
        proxy_ssl_server_name on;
        proxy_ssl_name www.googletagmanager.com;
        proxy_set_header Accept-Encoding "";
        expires 15m;
    }
    location /ngx-i/g/ {
        rewrite ^/ngx-i/g/(.*)$ /g/$1 break;
        proxy_pass https://$ga_upstream;
        proxy_set_header Host www.google-analytics.com;
        proxy_ssl_server_name on;
        proxy_ssl_name www.google-analytics.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    location /ngx-i/ {
        rewrite ^/ngx-i/(.*)$ /$1 break;
        proxy_pass https://$gtm_upstream;
        proxy_set_header Host www.googletagmanager.com;
        proxy_ssl_server_name on;
        proxy_ssl_name www.googletagmanager.com;
        proxy_set_header Accept-Encoding "";
    }
    location / {
        proxy_pass http://unix:/var/www/iprm/iprm.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /media/ {
        alias /var/www/iprm/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /var/www/iprm/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
