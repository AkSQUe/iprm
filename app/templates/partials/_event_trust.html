<!-- Trust block: про ІПРМ -->
<section class="iprm-section" aria-labelledby="trust-title">
  <div class="iprm-section__inner">
    <h2 id="trust-title" class="iprm-section__title">{% trans %}Чому <span class="apple-gradient-text">ІПРМ</span>{% endtrans %}</h2>
    <p class="iprm-section__subtitle">{{ _('Інститут регенеративної медицини – ваш надійний партнер у професійному розвитку') }}</p>
    <div class="iprm-trust-stats">
      <div class="iprm-trust-stats__item apple-reveal">
        <span class="iprm-trust-stats__value apple-gradient-text">500+</span>
        <span class="iprm-trust-stats__label">{{ _('учасників пройшли наші курси') }}</span>
      </div>
      <div class="iprm-trust-stats__item apple-reveal">
        <span class="iprm-trust-stats__value apple-gradient-text">30+</span>
        <span class="iprm-trust-stats__label">{{ _('проведених заходів') }}</span>
      </div>
      <div class="iprm-trust-stats__item apple-reveal">
        <span class="iprm-trust-stats__value apple-gradient-text">15+</span>
        <span class="iprm-trust-stats__label">{{ _('практикуючих тренерів') }}</span>
      </div>
      <div class="iprm-trust-stats__item apple-reveal">
        <span class="iprm-trust-stats__value apple-gradient-text">5+</span>
        <span class="iprm-trust-stats__label">{{ _('років досвіду навчання') }}</span>
      </div>
    </div>
  </div>
</section>
