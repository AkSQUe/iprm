<div id="cookie-banner" class="cookie-banner" hidden>
  <div class="cookie-banner__inner">
    <p class="cookie-banner__text">
      {% trans url=url_for('main.cookies') %}Ми використовуємо файли Cookie для забезпечення роботи сайту та покращення вашого досвіду. <a href="{{ url }}">Детальніше</a>{% endtrans %}
    </p>
    <div class="cookie-banner__actions">
      <button type="button" class="cookie-banner__btn cookie-banner__btn--accept" id="cookie-accept">{{ _('Прийняти') }}</button>
    </div>
  </div>
</div>
<script defer src="{{ url_for('static', filename='js/cookie-banner.js') }}?v={{ assets_version }}"></script>
